# ==============================================================================
# Google Health API - Supported Data Types Definition
# ==============================================================================
# Each datatype lists:
#   - name: The official datatype identifier used in the API URL path
#   - displayName: Human readable label
#   - endpointVersion: The Google Health API endpoint version supported (e.g. "v4")
#   - scopeRequired: The OAuth 2.0 scope required to read this datatype
#   - writeScopeRequired: The OAuth 2.0 scope required to write/create this datatype
#   - endpointsSupported: Map of all REST operations and boolean support flag (true if supported, false if not):
#       list: true/false
#       get: true/false
#       create: true/false
#       batchDelete: true/false
#       rollUp: true/false
#       dailyRollUp: true/false
#       exportExerciseTcx: true/false
#       reconcile: true/false
#       patch: true/false
#   - filterParameterName: Field pattern used in list filters (AIP-160)
#   - webhooksSupported: Boolean indicating if webhook subscription is supported
#   - minValue: Minimum valid numerical value supported by Google Health API
#   - maxValue: Maximum valid numerical value supported by Google Health API
#   - unit: Measurement unit (count, bpm, millimeters, grams, kcal, %, mg/dL, etc.)
#   - sampleValueField: JSON field path containing the primary measurement value
#
# To add a new datatype, append a new entry to the `dataTypes` list below.
# ==============================================================================

version: "1.0"
dataTypes:
  - name: "steps"
    displayName: "Step Count"
    endpointVersion: "v4"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      list: true
      get: true
      create: true
      batchDelete: true
      rollUp: true
      dailyRollUp: true
      exportExerciseTcx: false
      reconcile: false
      patch: false
    filterParameterName: "steps.interval.start_time"
    webhooksSupported: true
    minValue: 0
    maxValue: 1000000
    unit: "count"
    sampleValueField: "steps.count"

