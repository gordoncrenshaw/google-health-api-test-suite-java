# ==============================================================================
# Google Health API (v4) - Supported Data Types Definition
# ==============================================================================
# Each datatype lists:
#   - name: The official datatype identifier used in the API URL path
#   - displayName: Human readable label
#   - scopeRequired: The OAuth 2.0 scope required to read this datatype
#   - writeScopeRequired: The OAuth 2.0 scope required to write/create this datatype
#   - endpointsSupported: List of supported HTTP REST operations:
#       ["list", "get", "create", "batchDelete", "rollUp", "dailyRollUp"]
#   - filterParameterName: Field pattern used in list filters (AIP-160)
#   - webhooksSupported: Boolean indicating if webhook subscription is supported
#   - minValue: Minimum valid numerical value supported by Google Health API
#   - maxValue: Maximum valid numerical value supported by Google Health API
#   - unit: Measurement unit (count, bpm, millimeters, grams, kcal, %, mg/dL, etc.)
#   - sampleValueField: JSON field path containing the primary measurement value
#
# To add a new datatype, append a new entry to the `dataTypes` list below.
# ==============================================================================

version: "1.0"
dataTypes:
  - name: "steps"
    displayName: "Step Count"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "steps.interval.start_time"
    webhooksSupported: true
    minValue: 0
    maxValue: 1000000
    unit: "count"
    sampleValueField: "steps.count"

  - name: "distance"
    displayName: "Distance"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "distance.interval.start_time"
    webhooksSupported: true
    minValue: 0
    maxValue: 1000000000
    unit: "millimeters"
    sampleValueField: "distance.millimeters"

  - name: "floors"
    displayName: "Floors Climbed"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "floors.interval.start_time"
    webhooksSupported: true
    minValue: 0
    maxValue: 1000000
    unit: "count"
    sampleValueField: "floors.count"

  - name: "altitude"
    displayName: "Altitude"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "altitude.interval.start_time"
    webhooksSupported: true
    minValue: -500
    maxValue: 9000
    unit: "meters"
    sampleValueField: "altitude.gainMeters"

  - name: "active_energy_burned"
    displayName: "Active Calories Burned"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "active_energy_burned.interval.start_time"
    webhooksSupported: false
    minValue: 0
    maxValue: 1000000
    unit: "kcal"
    sampleValueField: "activeEnergyBurned.kcal"

  - name: "basal_energy_burned"
    displayName: "Basal Calories Burned"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "basal_energy_burned.interval.start_time"
    webhooksSupported: false
    minValue: 0
    maxValue: 1000000
    unit: "kcal"
    sampleValueField: "basalEnergyBurned.kcal"

  - name: "active_zone_minutes"
    displayName: "Active Zone Minutes"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "active_zone_minutes.interval.start_time"
    webhooksSupported: false
    minValue: 0
    maxValue: 1440
    unit: "minutes"
    sampleValueField: "activeZoneMinutes.activeZoneMinutes"

  - name: "heart_rate"
    displayName: "Heart Rate"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly"
    writeScopeRequired: "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly"
    endpointsSupported:
      - "list"
      - "get"
      - "create"
      - "batchDelete"
      - "rollUp"
      - "dailyRollUp"
    filterParameterName: "heart_rate.sample_time.physical_time"
    webhooksSupported: false
    minValue: 1
    maxValue: 300
    unit: "bpm"
    sampleValueField: "heartRate.beatsPerMinute"

  - name: "daily_resting_heart_rate"
