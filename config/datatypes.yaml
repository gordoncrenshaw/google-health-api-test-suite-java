      - "dailyRollUp"
    filterParameterName: "weight.sample_time.physical_time"
    webhooksSupported: true
    minValue: 0
    maxValue: 1000000
    unit: "grams"
    sampleValueField: "weight.weightGrams"

  - name: "height"
    displayName: "Body Height"
    scopeRequired: "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly"
