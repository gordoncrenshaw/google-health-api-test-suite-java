# ==============================================================================
# Google Health API Test Suite - Exercise Write & Update Standard Tests
# ==============================================================================
# Tests the full write/update/delete lifecycle for the exercise data type:
#   1. Calls create (POST /v4/users/{userId}/dataTypes/exercise/dataPoints) and stores ${uniqueName}
#   2. Calls get (GET /v4/users/{userId}/dataTypes/exercise/dataPoints/{dataPointId}) to verify insertion
#   3. Calls patch (PATCH /v4/users/{userId}/dataTypes/exercise/dataPoints/{dataPointId}) to update the value
#   4. Calls get (GET /v4/users/{userId}/dataTypes/exercise/dataPoints/{dataPointId}) to verify the update
#   5. Calls batchDelete (POST /v4/users/{userId}/dataTypes/exercise/dataPoints:batchDelete) to delete the entry
# ==============================================================================

name: "Google Health API Exercise Write & Update Standard Tests"
description: "Standard tests for creating, reading, updating, and deleting exercise data points"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ----------------------------------------------------------------------------
  # 1. Create an exercise entry and store the unique resource name
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Create"
    action: "create"
    dataType: "exercise"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:30:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "WALKING",
          "displayName": "Morning Walk"
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # ----------------------------------------------------------------------------
  # 2. Retrieve the created exercise entry using the unique name and verify value
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Get (Verify Create)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "WALKING"

  # ----------------------------------------------------------------------------
  # 3. Update (patch) the exercise entry using the unique name
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Update (Patch)"
    action: "patch"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:45:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "RUNNING",
          "displayName": "Afternoon Run"
        }
      }
    assertStatus: [200]
    validateRange: true

  # ----------------------------------------------------------------------------
  # 4. Retrieve the updated exercise entry using the unique name and verify update
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Get (Verify Update)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "RUNNING"

  # ----------------------------------------------------------------------------
  # Test lower limit (duration = 0s, startTime == endTime)
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Update (lower limit duration = 0s)"
    action: "patch"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:00:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "WALKING",
          "displayName": "Zero Duration Walk"
        }
      }
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Exercise Get (Verify Update lower limit duration = 0s)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "Zero Duration Walk"

  # ----------------------------------------------------------------------------
  # Test upper limit (duration = 24 hours / 86400s)
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Update (upper limit duration = 24h)"
    action: "patch"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T00:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-16T00:00:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "RUNNING",
          "displayName": "24 Hour Run"
        }
      }
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Exercise Get (Verify Update upper limit duration = 24h)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "24 Hour Run"

  # ----------------------------------------------------------------------------
  # 5. Delete the exercise entry via batchDelete specifying the unique name
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise BatchDelete"
    action: "batchDelete"
    dataType: "exercise"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ----------------------------------------------------------------------------
  # 6. Create an exercise entry at lower limit (duration = 0s)
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Create (lower limit duration = 0s)"
    action: "create"
    dataType: "exercise"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:00:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "WALKING",
          "displayName": "Zero Duration Walk"
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  - name: "Standard: Exercise Get (Verify Create lower limit duration = 0s)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "Zero Duration Walk"

  - name: "Standard: Exercise BatchDelete"
    action: "batchDelete"
    dataType: "exercise"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ----------------------------------------------------------------------------
  # 7. Create an exercise entry at upper limit (duration = 24h)
  # ----------------------------------------------------------------------------
  - name: "Standard: Exercise Create (upper limit duration = 24h)"
    action: "create"
    dataType: "exercise"
    body: |
      {
        "exercise": {
          "interval": {
            "startTime": "2026-10-15T00:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-16T00:00:00Z",
            "endUtcOffset": "-14400s"
          },
          "exerciseType": "RUNNING",
          "displayName": "24 Hour Run"
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  - name: "Standard: Exercise Get (Verify Create upper limit duration = 24h)"
    action: "get"
    dataType: "exercise"
    dataPointId: "${uniqueName}"
    assertStatus: [200]
    validateRange: true
    assertContains:
      - "24 Hour Run"

  - name: "Standard: Exercise BatchDelete"
    action: "batchDelete"
    dataType: "exercise"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false
