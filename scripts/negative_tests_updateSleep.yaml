# ==============================================================================
# Google Health API Test Suite - Sleep Write, Update & Delete Negative Tests
# ==============================================================================
# Tests boundary limits and negative inputs for the sleep data type across
# create, update (patch), and delete (batchDelete) endpoints using
# verifyWithGet: true to confirm persisted response values:
#   - Out-of-range lower bound (endTime before startTime) and upper bound (> 86400s)
#   - Missing value (no interval fields), null value, and empty string ("")
#   - BatchDelete with no value ([]), null ([null]), and empty string ([""])
# ==============================================================================

name: "Google Health API Sleep Write, Update & Delete Negative Tests"
description: "Boundary and negative tests for creating, updating, and deleting sleep data points using verifyWithGet"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ============================================================================
  # SECTION 1: Baseline Create & Update (Patch) Boundary and Negative Tests
  # ============================================================================

  # 1. Create a baseline sleep entry and verify via GET
  - name: "Standard: Sleep Create"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T09:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # 2. Negative Update: Below lower bound limit (endTime before startTime, duration < 0s)
  - name: "Negative: Sleep Update Below Lower Bound (endTime < startTime)"
    action: "patch"
    verifyWithGet: true
    dataType: "sleep"
    dataPointId: "${uniqueName}"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T09:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T02:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 3. Negative Update: Above upper bound limit (duration > 86400s)
  - name: "Negative: Sleep Update Above Upper Bound (duration > 86400s)"
    action: "patch"
    verifyWithGet: true
    dataType: "sleep"
    dataPointId: "${uniqueName}"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-01T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-30T09:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 4. Negative Update: No value provided (interval fields omitted)
  - name: "Negative: Sleep Update (no value)"
    action: "patch"
    verifyWithGet: true
    dataType: "sleep"
    dataPointId: "${uniqueName}"
    body: |
      {
        "sleep": {
          "interval": {
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 5. Negative Update: null value provided (endTime = null)
  - name: "Negative: Sleep Update (endTime = null)"
    action: "patch"
    verifyWithGet: true
    dataType: "sleep"
    dataPointId: "${uniqueName}"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": null,
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 6. Negative Update: Empty string value provided (endTime = "")
  - name: "Negative: Sleep Update (endTime = empty string)"
    action: "patch"
    verifyWithGet: true
    dataType: "sleep"
    dataPointId: "${uniqueName}"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 7. Clean up baseline sleep entry via batchDelete
  - name: "Standard: Sleep BatchDelete (Clean Up Baseline)"
    action: "batchDelete"
    dataType: "sleep"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ============================================================================
  # SECTION 2: Create Boundary and Negative Tests
  # ============================================================================

  # 8. Negative Create: Below lower bound limit (endTime before startTime, duration < 0s)
  - name: "Negative: Sleep Create Below Lower Bound (endTime < startTime)"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T09:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T02:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 9. Negative Create: Above upper bound limit (duration > 86400s)
  - name: "Negative: Sleep Create Above Upper Bound (duration > 86400s)"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-01T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-30T09:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 10. Negative Create: No value provided (interval fields omitted)
  - name: "Negative: Sleep Create (no value)"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 11. Negative Create: null value provided (endTime = null)
  - name: "Negative: Sleep Create (endTime = null)"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": null,
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 12. Negative Create: Empty string value provided (endTime = "")
  - name: "Negative: Sleep Create (endTime = empty string)"
    action: "create"
    verifyWithGet: true
    dataType: "sleep"
    body: |
      {
        "sleep": {
          "interval": {
            "startTime": "2026-10-15T02:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # ============================================================================
  # SECTION 3: Negative Delete (BatchDelete) Tests
  # ============================================================================

  # 13. Negative BatchDelete: No value provided (empty names array)
  - name: "Negative: Sleep BatchDelete (no value)"
    action: "batchDelete"
    dataType: "sleep"
    body: |
      {
        "names": [
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 14. Negative BatchDelete: null value provided
  - name: "Negative: Sleep BatchDelete (null)"
    action: "batchDelete"
    dataType: "sleep"
    body: |
      {
        "names": [
          null
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 15. Negative BatchDelete: Empty string provided
  - name: "Negative: Sleep BatchDelete (empty string)"
    action: "batchDelete"
    dataType: "sleep"
    body: |
      {
        "names": [
          ""
        ]
      }
    assertStatus: [400]
    validateRange: false

