# Google Health API Heart Rate Standard Tests
name: "Google Health API Heart Rate Tests"
description: "Standard tests for Heart Rate datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Heart Rate List (Default)"
    action: "list"
    dataType: "heart-rate"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (pageSize)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (pageToken)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (filter: physical_time)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      filter: 'heart_rate.sample_time.physical_time >= "2026-10-01T00:00:00Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (filter: physical_time range)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      filter: 'heart_rate.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND heart_rate.sample_time.physical_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Heart Rate List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
