# Google Health API Daily VO2 Max Standard Tests
name: "Google Health API Daily VO2 Max Tests"
description: "Standard tests for Daily VO2 Max datatype"
userId: me # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Daily VO2 Max List (Default)"
    action: "list"
    dataType: "daily-vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (pageSize)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (pageToken)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (filter: date)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (filter: date range)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01" AND daily_vo2_max.date < "2026-10-08"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: google-sources)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (combined)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01" AND daily_vo2_max.date < "2026-10-08"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (Default)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (pageSize)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (pageToken)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (filter: date)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (filter: date range)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01" AND daily_vo2_max.date < "2026-10-08"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: all-sources)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: google-wearables)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: google-sources)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (combined)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.date >= "2026-10-01" AND daily_vo2_max.date < "2026-10-08"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true
