# Google Health API Hydration Log Standard Tests
name: "Google Health API Hydration Log Tests"
description: "Standard tests for Hydration Log datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Hydration Log List (Default)"
    action: "list"
    dataType: "hydration-log"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (pageSize)"
    action: "list"
    dataType: "hydration-log"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (pageToken)"
    action: "list"
    dataType: "hydration-log"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (filter: civil_start_time)"
    action: "list"
    dataType: "hydration-log"
    queryParams:
      filter: 'hydration_log.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (filter: civil_start_time range)"
    action: "list"
    dataType: "hydration-log"
    queryParams:
      filter: 'hydration_log.interval.civil_start_time >= "2026-10-01" AND hydration_log.interval.civil_start_time < "2026-10-08"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "hydration-log"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Hydration Log List (dataSourceFamily: google-wearables)"
