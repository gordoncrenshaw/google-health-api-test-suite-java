# Google Health API Distance Standard Tests
name: "Google Health API Distance Tests"
description: "Standard tests for Distance datatype"
userId: me # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Distance List (Default)"
    action: "list"
    dataType: "distance"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (pageSize)"
    action: "list"
    dataType: "distance"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (pageToken)"
    action: "list"
    dataType: "distance"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (filter: civil_start_time)"
    action: "list"
    dataType: "distance"
    queryParams:
      filter: 'distance.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (filter: start_time)"
    action: "list"
    dataType: "distance"
    queryParams:
      filter: 'distance.interval.start_time >= "2026-10-01T00:00:00Z" AND distance.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "distance"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Distance List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "distance"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
