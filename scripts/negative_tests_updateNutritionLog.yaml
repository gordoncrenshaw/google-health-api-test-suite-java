        }
      }
    assertStatus: [400]
    validateRange: true

  # 6. Negative Update: Empty string value provided (serving.amount = "")
  - name: "Negative: Nutrition Log Update (serving.amount = empty string)"
    action: "patch"
    verifyWithGet: true
    dataType: "nutrition-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "nutritionLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:30:00Z",
            "endUtcOffset": "-14400s"
          },
          "food": "users/me/dataTypes/food/dataPoints/825916320",
          "mealType": "DINNER",
          "serving": {
            "amount": "",
            "foodMeasurementUnit": "users/me/dataTypes/food-measurement-unit/dataPoints/17"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 7. Clean up baseline nutrition-log entry via batchDelete
  - name: "Standard: Nutrition Log BatchDelete (Clean Up Baseline)"
    action: "batchDelete"
    dataType: "nutrition-log"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

