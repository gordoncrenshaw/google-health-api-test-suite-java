          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:30:00Z",
            "endUtcOffset": "-14400s"
          },
          "food": "users/me/dataTypes/food/dataPoints/825916320",
          "mealType": "LUNCH",
          "serving": {
            "amount": -1,
