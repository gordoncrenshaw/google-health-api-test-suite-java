# Google Health API Weight Custom Tests
name: "Google Health API Weight Tests"
description: "Custom tests for Weight datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Custom: Weight List (userId: dummyValue)"
    action: "list"
    dataType: "weight"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true

  - name: "Custom: Weight Reconcile (userId: dummyValue)"
    action: "reconcile"
    dataType: "weight"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true
