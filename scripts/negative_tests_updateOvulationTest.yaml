# ==============================================================================
# Google Health API Test Suite - Ovulation Test Write, Update & Delete Negative Tests
# ==============================================================================
# Tests boundary limits and negative inputs for the ovulation-test data type across
# create, update (patch), and delete (batchDelete) endpoints using
# verifyWithGet: true to confirm persisted response values:
#   - Out-of-range lower bound (utcOffset < -64800s) and upper bound (> 64800s)
#   - Missing value (no result field), null value, and empty string ("")
#   - BatchDelete with no value ([]), null ([null]), and empty string ([""])
# ==============================================================================

name: "Google Health API Ovulation Test Write, Update & Delete Negative Tests"
description: "Boundary and negative tests for creating, updating, and deleting ovulation-test data points using verifyWithGet"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ============================================================================
  # SECTION 1: Baseline Create & Update (Patch) Boundary and Negative Tests
  # ============================================================================

  # 1. Create a baseline ovulation-test entry
  - name: "Standard: Ovulation Test Create (result = NEGATIVE)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          },
          "result": "NEGATIVE"
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # 2. Negative Update: Below lower bound limit (utcOffset < -64800s)
  - name: "Negative: Ovulation Test Update Below Lower Bound (utcOffset = -99999s)"
    action: "patch"
    verifyWithGet: true
    dataType: "ovulation-test"
    dataPointId: "${uniqueName}"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-99999s"
          },
          "result": "LUTEINIZING_HORMONE_SURGE"
        }
      }
    assertStatus: [400]
    validateRange: true

  # 3. Negative Update: Above upper bound limit (utcOffset > 64800s)
  - name: "Negative: Ovulation Test Update Above Upper Bound (utcOffset = 99999s)"
    action: "patch"
    verifyWithGet: true
    dataType: "ovulation-test"
    dataPointId: "${uniqueName}"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "99999s"
          },
          "result": "LUTEINIZING_HORMONE_SURGE"
        }
      }
    assertStatus: [400]
    validateRange: true

  # 4. Negative Update: No value provided (result field omitted)
  - name: "Negative: Ovulation Test Update (no value)"
    action: "patch"
    verifyWithGet: true
    dataType: "ovulation-test"
    dataPointId: "${uniqueName}"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 5. Negative Update: null value provided (result = null)
  - name: "Negative: Ovulation Test Update (result = null)"
    action: "patch"
    verifyWithGet: true
    dataType: "ovulation-test"
    dataPointId: "${uniqueName}"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          },
          "result": null
        }
      }
    assertStatus: [400]
    validateRange: true

  # 6. Negative Update: Empty string value provided (result = "")
  - name: "Negative: Ovulation Test Update (result = empty string)"
    action: "patch"
    verifyWithGet: true
    dataType: "ovulation-test"
    dataPointId: "${uniqueName}"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          },
          "result": ""
        }
      }
    assertStatus: [400]
    validateRange: true

  # 7. Clean up baseline ovulation-test entry via batchDelete
  - name: "Standard: Ovulation Test BatchDelete (Clean Up Baseline)"
    action: "batchDelete"
    dataType: "ovulation-test"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ============================================================================
  # SECTION 2: Create Boundary and Negative Tests
  # ============================================================================

  # 8. Negative Create: Below lower bound limit (utcOffset < -64800s)
  - name: "Negative: Ovulation Test Create Below Lower Bound (utcOffset = -99999s)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-99999s"
          },
          "result": "NEGATIVE"
        }
      }
    assertStatus: [400]
    validateRange: true

  # 9. Negative Create: Above upper bound limit (utcOffset > 64800s)
  - name: "Negative: Ovulation Test Create Above Upper Bound (utcOffset = 99999s)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "99999s"
          },
          "result": "NEGATIVE"
        }
      }
    assertStatus: [400]
    validateRange: true

  # 10. Negative Create: No value provided (result field omitted)
  - name: "Negative: Ovulation Test Create (no value)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 11. Negative Create: null value provided (result = null)
  - name: "Negative: Ovulation Test Create (result = null)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          },
          "result": null
        }
      }
    assertStatus: [400]
    validateRange: true

  # 12. Negative Create: Empty string value provided (result = "")
  - name: "Negative: Ovulation Test Create (result = empty string)"
    action: "create"
    verifyWithGet: true
    dataType: "ovulation-test"
    body: |
      {
        "ovulationTest": {
          "sampleTime": {
            "physicalTime": "2026-10-15T08:00:00Z",
            "utcOffset": "-14400s"
          },
          "result": ""
        }
      }
    assertStatus: [400]
    validateRange: true

  # ============================================================================
  # SECTION 3: Negative Delete (BatchDelete) Tests
  # ============================================================================

  # 13. Negative BatchDelete: No value provided (empty names array)
  - name: "Negative: Ovulation Test BatchDelete (no value)"
    action: "batchDelete"
    dataType: "ovulation-test"
    body: |
      {
        "names": [
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 14. Negative BatchDelete: null value provided
  - name: "Negative: Ovulation Test BatchDelete (null)"
    action: "batchDelete"
    dataType: "ovulation-test"
    body: |
      {
        "names": [
          null
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 15. Negative BatchDelete: Empty string provided
  - name: "Negative: Ovulation Test BatchDelete (empty string)"
    action: "batchDelete"
    dataType: "ovulation-test"
    body: |
      {
        "names": [
          ""
        ]
      }
    assertStatus: [400]
    validateRange: false

