# Quick smoke test for verifying Google Health API basic connectivity
name: "Google Health API Smoke Test"
description: "Quick sanity checks on all endpoints"
stopOnError: false

steps:
  # Datatype Tests
  - name: "Standard: Floors DailyRollUp (Default)"
    action: "dailyrollup"
    dataType: "floors"
    body: |
      {
        "range": {
          "start": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 1
            }, 
            "time": {
              "hours": 0, 
              "minutes": 0, 
              "seconds": 0
            }
          },
          "end": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 8
            }, 
            "time": {
              "hours": 23, 
              "minutes": 59, 
              "seconds": 59
            }
          }
        }
      }
    assertStatus: [200]

