      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Floors Reconcile (filter: civil_start_time)"
    action: "reconcile"
    dataType: "floors"
    queryParams:
      filter: 'floors.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Floors Reconcile (filter: start_time)"
    action: "reconcile"
    dataType: "floors"
    queryParams:
      filter: 'floors.interval.start_time >= "2026-10-01T00:00:00Z" AND floors.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

