  - name: "Standard: Floors Reconcile (Default)"
    action: "reconcile"
    dataType: "floors"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Floors Reconcile (pageSize)"
    action: "reconcile"
    dataType: "floors"
