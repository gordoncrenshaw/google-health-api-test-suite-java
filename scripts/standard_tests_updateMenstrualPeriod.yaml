# ==============================================================================
# Google Health API Test Suite - Menstrual Period Write & Update Standard Tests
# ==============================================================================
# Tests the write/update/delete lifecycle for the menstrual-period data type
# (note: menstrual-period does not support the get endpoint):
#   1. Calls create (POST /v4/users/{userId}/dataTypes/menstrual-period/dataPoints) and stores ${uniqueName}
#   2. Calls patch (PATCH /v4/users/{userId}/dataTypes/menstrual-period/dataPoints/{dataPointId}) to update the value
#   3. Calls batchDelete (POST /v4/users/{userId}/dataTypes/menstrual-period/dataPoints:batchDelete) to delete the entry
# ==============================================================================

name: "Google Health API Menstrual Period Write & Update Standard Tests"
description: "Standard tests for creating, updating, and deleting menstrual-period data points"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ----------------------------------------------------------------------------
  # 1. Create a menstrual-period entry and store the unique resource name
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Create"
    action: "create"
    dataType: "menstrual-period"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-04T20:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # ----------------------------------------------------------------------------
  # 2. Update (patch) the menstrual-period entry using the unique name
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Update (Patch)"
    action: "patch"
    dataType: "menstrual-period"
    dataPointId: "${uniqueName}"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-05T20:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200]
    validateRange: true

  # ----------------------------------------------------------------------------
  # Test lower limit (duration = 1m)
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Update (lower limit duration = 1m)"
    action: "patch"
    dataType: "menstrual-period"
    dataPointId: "${uniqueName}"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-01T08:01:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200]
    validateRange: true

  # ----------------------------------------------------------------------------
  # Test upper limit (duration = 14 days)
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Update (upper limit duration = 14d)"
    action: "patch"
    dataType: "menstrual-period"
    dataPointId: "${uniqueName}"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T08:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200]
    validateRange: true

  # ----------------------------------------------------------------------------
  # 3. Delete the menstrual-period entry via batchDelete specifying the unique name
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period BatchDelete"
    action: "batchDelete"
    dataType: "menstrual-period"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ----------------------------------------------------------------------------
  # 4. Create a menstrual-period entry at lower limit (duration = 1m)
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Create (lower limit duration = 1m)"
    action: "create"
    dataType: "menstrual-period"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-01T08:01:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  - name: "Standard: Menstrual Period BatchDelete"
    action: "batchDelete"
    dataType: "menstrual-period"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ----------------------------------------------------------------------------
  # 5. Create a menstrual-period entry at upper limit (duration = 14d)
  # ----------------------------------------------------------------------------
  - name: "Standard: Menstrual Period Create (upper limit duration = 14d)"
    action: "create"
    dataType: "menstrual-period"
    body: |
      {
        "menstrualPeriod": {
          "interval": {
            "startTime": "2026-10-01T08:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T08:00:00Z",
            "endUtcOffset": "-14400s"
          }
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  - name: "Standard: Menstrual Period BatchDelete"
    action: "batchDelete"
    dataType: "menstrual-period"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false
