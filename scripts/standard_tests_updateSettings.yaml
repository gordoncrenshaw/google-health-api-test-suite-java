  # ----------------------------------------------------------------------------
  # 9. Update Combined Settings Fields
  # ----------------------------------------------------------------------------
  - name: "Standard: Update User Settings (combined)"
    action: "updateSettings"
    verifyWithGet: true
    queryParams:
      updateMask: "distanceUnit,glucoseUnit,heightUnit,swimUnit,temperatureUnit,waterUnit,weightUnit"
    body: |
      {
        "distanceUnit": "DISTANCE_UNIT_KILOMETERS",
        "glucoseUnit": "GLUCOSE_UNIT_MG_DL",
        "heightUnit": "HEIGHT_UNIT_CENTIMETERS",
        "swimUnit": "SWIM_UNIT_METERS",
        "temperatureUnit": "TEMPERATURE_UNIT_FAHRENHEIT",
        "waterUnit": "WATER_UNIT_FL_OZ",
        "weightUnit": "WEIGHT_UNIT_POUNDS"
      }
    assertStatus: [200]

  - name: "Standard: Update User Settings (tests)"
    action: "updateSettings"
    verifyWithGet: true
    queryParams:
      updateMask: "heightUnit"
    body: |
      {
        "heightUnit": "HEIGHT_UNIT_CENTIMETERS"
      }
    assertStatus: [200]
