# ==============================================================================
# Google Health API Test Suite - Update User Settings Standard Tests
# ==============================================================================
# Tests the users.updateSettings endpoint (PATCH /v4/users/{userId}/settings):
#   1. Calls PATCH /v4/users/{userId}/settings with updateMask and Settings body
#   2. Calls GET /v4/users/{userId}/settings (via verifyWithGet: true)
#   3. Verifies the GET response reflects the updated Settings field values
# Reference: https://developers.google.com/health/reference/rest/v4/users/updateSettings
# ==============================================================================

name: "Google Health API Update User Settings Standard Tests"
description: "Standard tests for updating user settings via updateSettings and verifying persistence via getSettings"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ----------------------------------------------------------------------------
  # 1. Update Distance Unit (distanceUnit)
  # ----------------------------------------------------------------------------
  - name: "Standard: Update User Settings (distanceUnit=unspecified)"
    action: "updateSettings"
    verifyWithGet: true
    queryParams:
      updateMask: "distanceUnit"
    body: |
      {
        "distanceUnit": "DISTANCE_UNIT_UNSPECIFIED"
      }
    assertStatus: [200]

  - name: "Standard: Update User Settings (distanceUnit=miles)"
    action: "updateSettings"
    verifyWithGet: true
    queryParams:
      updateMask: "distanceUnit"
    body: |
      {
        "distanceUnit": "DISTANCE_UNIT_MILES"
      }
    assertStatus: [200]

  - name: "Standard: Update User Settings (distanceUnit=kilometers)"
    action: "updateSettings"
    verifyWithGet: true
    queryParams:
      updateMask: "distanceUnit"
    body: |
      {
        "distanceUnit": "DISTANCE_UNIT_KILOMETERS"
      }
    assertStatus: [200]

  # ----------------------------------------------------------------------------
  # 2. Update Glucose Unit (glucoseUnit)
