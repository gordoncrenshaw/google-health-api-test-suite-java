# Google Health API Daily Resting Heart Rate Custom Tests
name: "Google Health API Daily Resting Heart Rate Tests"
description: "Custom tests for Daily Resting Heart Rate datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Custom: Daily Resting Heart Rate List (userId: dummyValue)"
    action: "list"
    dataType: "daily-resting-heart-rate"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true

  - name: "Custom: Daily Resting Heart Rate Reconcile (userId: dummyValue)"
    action: "reconcile"
    dataType: "daily-resting-heart-rate"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true
