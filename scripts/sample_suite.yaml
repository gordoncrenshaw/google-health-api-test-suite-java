# ==============================================================================
# Google Health API Test Suite - Sample Script (Mode 3)
# ==============================================================================
# Demonstrates running automated test steps with query filters, assertions,
# and min/max value validation against datatypes.yaml.
# ==============================================================================

name: "Google Health API End-to-End Sample Test Suite"
description: "Verifies user identity, device pairing, and query endpoints for activity and biometric metrics"
stopOnError: false

steps:
  # Step 1: Verify Authorization Status
  - name: "Verify Stored Authorization Tokens"
    action: "check_auth"
    assertStatus: [200]

  # Step 2: Query User Profile
  - name: "Fetch User Profile Identity"
    action: "profile"
    assertStatus: [200]

  # Step 3: Update User Profile
  - name: "Update User Profile Details"
    action: "update_profile"
    body: '{"displayName": "TestSuite QA User", "locale": "en-US"}'
    assertStatus: [200]

  # Step 4: Query User Settings
  - name: "Fetch User Settings"
    action: "settings"
    assertStatus: [200]

  # Step 5: Update User Settings
  - name: "Update User Settings"
    action: "update_settings"
    body: '{"temperatureUnit": "CELSIUS", "timeZone": "America/New_York"}'
    assertStatus: [200]

  # Step 6: Query Irregular Rhythm Notifications Profile
  - name: "Fetch Irregular Rhythm Notifications Profile"
    action: "irn_profile"
    assertStatus: [200]

  # Step 7: List Paired Wearables and Trackers
  - name: "List Paired Devices"
    action: "devices"
    assertStatus: [200]

  # Step 8: Query Step Count with Range Validation
  - name: "Query Steps DataPoints"
    action: "list"
    dataType: "steps"
    queryParams:
      pageSize: "25"
    assertStatus: [200]
    validateRange: true

  # Step 9: Query Heart Rate Samples with Range Validation (1-300 bpm)
  - name: "Query Heart Rate Samples"
    action: "list"
    dataType: "heart-rate"
    queryParams:
      pageSize: "25"
    assertStatus: [200]
    validateRange: true

  # Step 10: Query Distance Millimeters
  - name: "Query Distance DataPoints"
    action: "list"
    dataType: "distance"
    queryParams:
      pageSize: "25"
    assertStatus: [200]
    validateRange: true

  # Step 11: Query Body Weight in Grams
  - name: "Query Weight Measurements"
    action: "list"
    dataType: "weight"
    queryParams:
      pageSize: "10"
    assertStatus: [200]
    validateRange: true

  # Step 12: Physical Rollup for Steps
  - name: "RollUp Steps Aggregation"
    action: "rollup"
    dataType: "steps"
    assertStatus: [200]
