# Google Health API Steps Custom Tests
name: "Google Health API Steps Tests"
description: "Custom tests for Steps datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Custom: Steps List (userId: dummyValue)"
    action: "list"
    dataType: "steps"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true

  - name: "Custom: Steps DailyRollUp (userId: dummyValue)"
    action: "dailyrollup"
    dataType: "steps"
    userId: dummyValue
    body: |
      {
        "range": {
          "start": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 1
            }, 
            "time": {
              "hours": 0, 
              "minutes": 0, 
              "seconds": 0
            }
          },
          "end": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 8
            }, 
            "time": {
              "hours": 23, 
              "minutes": 59, 
              "seconds": 59
            }
          }
        }
      }
    assertStatus: [403]

  - name: "Custom: Steps RollUp (userId: dummyValue)"
    action: "rollup"
    dataType: "steps"
    userId: dummyValue
    body: |
      {
        "range": {
          "startTime": "2026-10-01T00:00:00Z", 
          "endTime": "2026-10-08T23:59:59Z"
        },
       "windowSize": "60s"
      }
    assertStatus: [403]

  - name: "Custom: Steps Reconcile (userId: dummyValue)"
    action: "reconcile"
    dataType: "steps"
    userId: dummyValue
    assertStatus: [403]
    validateRange: true
