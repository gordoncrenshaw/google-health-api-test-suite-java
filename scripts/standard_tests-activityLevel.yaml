# Quick smoke test for verifying Google Health API basic connectivity
name: "Google Health API Smoke Test"
description: "Quick sanity checks on all endpoints"
stopOnError: false

steps:
  # Datatype Tests
  - name: "Standard: Activity Level List (Default)"
    action: "list"
    dataType: "activity-level"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (pageSize)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (pageToken)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (filter: civil_start_time)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (filter: start_time)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.start_time >= "2026-10-01T00:00:00Z" AND activity_level.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (dataSourceFamily: google-sources)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level List (combined)"
    action: "list"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.start_time >= "2026-10-01T00:00:00Z" AND activity_level.interval.start_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (Default)"
    action: "reconcile"
    dataType: "activity-level"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (pageSize)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (pageToken)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (filter: civil_start_time)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (filter: start_time)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.start_time >= "2026-10-01T00:00:00Z" AND activity_level.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (dataSourceFamily: all-sources)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (dataSourceFamily: google-wearables)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (dataSourceFamily: google-sources)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Activity Level Reconcile (combined)"
    action: "reconcile"
    dataType: "activity-level"
    queryParams:
      filter: 'activity_level.interval.start_time >= "2026-10-01T00:00:00Z" AND activity_level.interval.start_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true
