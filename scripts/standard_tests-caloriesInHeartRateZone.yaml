# Google Health API Calories In Heart Rate Zone Standard Tests
name: "Google Health API Calories In Heart Rate Zone Tests"
description: "Standard tests for Calories In Heart Rate Zone datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Calories In Heart Rate Zone DailyRollUp (Default)"
    action: "dailyrollup"
    dataType: "calories-in-heart-rate-zone"
    body: |
      {
        "range": {
          "start": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 1
            }, 
            "time": {
              "hours": 0, 
              "minutes": 0, 
              "seconds": 0
            }
          },
          "end": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 8
            }, 
            "time": {
              "hours": 23, 
              "minutes": 59, 
              "seconds": 59
            }
          }
        }
      }
    assertStatus: [200]

