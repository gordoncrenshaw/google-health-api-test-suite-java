# Google Health API VO2 Max Standard Tests
name: "Google Health API VO2 Max Tests"
description: "Standard tests for VO2 Max datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: VO2 Max List (Default)"
    action: "list"
    dataType: "vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (pageSize)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (pageToken)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (filter: civil_time)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      filter: 'vo2_max.sample_time.civil_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (filter: physical_time)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      filter: 'vo2_max.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND vo2_max.sample_time.physical_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (dataSourceFamily: google-sources)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max List (combined)"
    action: "list"
    dataType: "vo2-max"
    queryParams:
      filter: 'vo2_max.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND vo2_max.sample_time.physical_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (Default)"
    action: "reconcile"
    dataType: "vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (pageSize)"
    action: "reconcile"
    dataType: "vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (pageToken)"
    action: "reconcile"
    dataType: "vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (filter: civil_time)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      filter: 'vo2_max.sample_time.civil_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (filter: physical_time)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      filter: 'vo2_max.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND vo2_max.sample_time.physical_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (dataSourceFamily: all-sources)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (dataSourceFamily: google-wearables)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (dataSourceFamily: google-sources)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: VO2 Max Reconcile (combined)"
    action: "reconcile"
    dataType: "vo2_max"
    queryParams:
      filter: 'vo2_max.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND vo2_max.sample_time.physical_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true