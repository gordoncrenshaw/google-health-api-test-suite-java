# ==============================================================================
# Google Health API Test Suite - Hydration Log Write, Update & Delete Negative Tests
# ==============================================================================
# Tests boundary limits and negative inputs for the hydration-log data type across
# create, update (patch), and delete (batchDelete) endpoints using
# verifyWithGet: true to confirm persisted response values:
#   - Out-of-range lower bound (-1) and upper bound (100001)
#   - Missing value (no milliliters field), null value, and empty string ("")
#   - BatchDelete with no value ([]), null ([null]), and empty string ([""])
# ==============================================================================

name: "Google Health API Hydration Log Write, Update & Delete Negative Tests"
description: "Boundary and negative tests for creating, updating, and deleting hydration-log data points using verifyWithGet"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ============================================================================
  # SECTION 1: Baseline Create & Update (Patch) Boundary and Negative Tests
  # ============================================================================

  # 1. Create a baseline hydration-log entry and verify via GET
  - name: "Standard: Hydration Log Create (milliliters = 350)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": 350
          }
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # 2. Negative Update: Below lower bound limit (-1)
  - name: "Negative: Hydration Log Update Below Lower Bound (milliliters = -1)"
    action: "patch"
    verifyWithGet: true
    dataType: "hydration-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": -1
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 3. Negative Update: Above upper bound limit (100001)
  - name: "Negative: Hydration Log Update Above Upper Bound (milliliters = 100001)"
    action: "patch"
    verifyWithGet: true
    dataType: "hydration-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": 100001
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 4. Negative Update: No value provided (milliliters field omitted)
  - name: "Negative: Hydration Log Update (no value)"
    action: "patch"
    verifyWithGet: true
    dataType: "hydration-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 5. Negative Update: null value provided (milliliters = null)
  - name: "Negative: Hydration Log Update (milliliters = null)"
    action: "patch"
    verifyWithGet: true
    dataType: "hydration-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": null
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 6. Negative Update: Empty string value provided (milliliters = "")
  - name: "Negative: Hydration Log Update (milliliters = empty string)"
    action: "patch"
    verifyWithGet: true
    dataType: "hydration-log"
    dataPointId: "${uniqueName}"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": ""
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 7. Clean up baseline hydration-log entry via batchDelete
  - name: "Standard: Hydration Log BatchDelete (Clean Up Baseline)"
    action: "batchDelete"
    dataType: "hydration-log"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ============================================================================
  # SECTION 2: Create Boundary and Negative Tests
  # ============================================================================

  # 8. Negative Create: Below lower bound limit (-1)
  - name: "Negative: Hydration Log Create Below Lower Bound (milliliters = -1)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": -1
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 9. Negative Create: Above upper bound limit (100001)
  - name: "Negative: Hydration Log Create Above Upper Bound (milliliters = 100001)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": 100001
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 10. Negative Create: No value provided (milliliters field omitted)
  - name: "Negative: Hydration Log Create (no value)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 11. Negative Create: null value provided (milliliters = null)
  - name: "Negative: Hydration Log Create (milliliters = null)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": null
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # 12. Negative Create: Empty string value provided (milliliters = "")
  - name: "Negative: Hydration Log Create (milliliters = empty string)"
    action: "create"
    verifyWithGet: true
    dataType: "hydration-log"
    body: |
      {
        "hydrationLog": {
          "interval": {
            "startTime": "2026-10-15T12:00:00Z",
            "startUtcOffset": "-14400s",
            "endTime": "2026-10-15T12:15:00Z",
            "endUtcOffset": "-14400s"
          },
          "amountConsumed": {
            "milliliters": ""
          }
        }
      }
    assertStatus: [400]
    validateRange: true

  # ============================================================================
  # SECTION 3: Negative Delete (BatchDelete) Tests
  # ============================================================================

  # 13. Negative BatchDelete: No value provided (empty names array)
  - name: "Negative: Hydration Log BatchDelete (no value)"
    action: "batchDelete"
    dataType: "hydration-log"
    body: |
      {
        "names": [
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 14. Negative BatchDelete: null value provided
  - name: "Negative: Hydration Log BatchDelete (null)"
    action: "batchDelete"
    dataType: "hydration-log"
    body: |
      {
        "names": [
          null
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 15. Negative BatchDelete: Empty string provided
  - name: "Negative: Hydration Log BatchDelete (empty string)"
    action: "batchDelete"
    dataType: "hydration-log"
    body: |
      {
        "names": [
          ""
        ]
      }
    assertStatus: [400]
    validateRange: false

