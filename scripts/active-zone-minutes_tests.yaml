# Quick smoke test for verifying Google Health API basic connectivity
name: "Google Health API Smoke Test"
description: "Quick sanity checks on all endpoints"
stopOnError: false

steps:
  - name: "Standard: Check Auth Status"
    action: "check_auth"
    assertStatus: [200]

  # Datatype Tests
  - name: "Standard: Active Zone Minutes List (Default)"
    action: "list"
    dataType: "active-zone-minutes"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Zone Minutes List (pageSize)"
    action: "list"
    dataType: "active-zone-minutes"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Zone Minutes List (pageToken)"
    action: "list"
    dataType: "active-zone-minutes"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Zone Minutes List (filter: civil_start_time)"
    action: "list"
    dataType: "active-zone-minutes"
    queryParams:
      filter: 'active_zone_minutes.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Zone Minutes List (filter: start_time)"
    action: "list"
    dataType: "active-zone-minutes"
    queryParams:
      filter: 'active_zone_minutes.interval.start_time >= "2026-10-01T00:00:00Z" AND active_zone_minutes.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Zone Minutes List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "active-zone-minutes"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

