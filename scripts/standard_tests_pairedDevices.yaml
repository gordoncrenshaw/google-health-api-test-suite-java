# ==============================================================================
# Google Health API Test Suite - Paired Devices Standard Tests
# ==============================================================================
# Tests user paired devices endpoints:
#   - listDevices (GET /v4/users/{userId}/pairedDevices)
# ==============================================================================

name: "Google Health API Paired Devices Tests"
description: "Standard tests for paired devices endpoints"
stopOnError: false

steps:
  # ----------------------------------------------------------------------------
  # 1. Paired Devices (GET /v4/users/{userId}/pairedDevices)
  # ----------------------------------------------------------------------------
  - name: "Standard: User Paired Devices (me)"
    action: "devices"
    userId: me
    assertStatus: [200]

  - name: "Standard: User Paired Devices (healthUserId)"
    action: "devices"
    userId: healthUserId
    assertStatus: [200]
