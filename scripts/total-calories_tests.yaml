  - name: "Standard: Check Auth Status"
    action: "check_auth"
    assertStatus: [200]

  # Datatype Tests
  - name: "Standard: Total Calories DailyRollUp (Default)"
    action: "dailyrollup"
    dataType: "total-calories"
    body: |
      {
        "range": {
          "start": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 1
            }, 
            "time": {
              "hours": 0, 
              "minutes": 0, 
              "seconds": 0
            }
          },
          "end": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 8
            }, 
            "time": {
              "hours": 23, 
              "minutes": 59, 
              "seconds": 59
            }
