  - name: "Standard: Time In Heart Rate Zone List (Default)"
    action: "list"
    dataType: "time-in-heart-rate-zone"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Time In Heart Rate Zone List (pageSize)"
    action: "list"
    dataType: "time-in-heart-rate-zone"
    queryParams:
      pageSize: "5"
