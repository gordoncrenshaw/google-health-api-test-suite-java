# Quick smoke test for verifying Google Health API basic connectivity
name: "Google Health API Smoke Test"
description: "Quick sanity checks on all endpoints"
stopOnError: false

steps:
  - name: "Standard: Check Auth Status"
    action: "check_auth"
    assertStatus: [200]

  # Datatype Tests
  - name: "Standard: Daily VO2 Max List (Default)"
    action: "list"
    dataType: "daily-vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (pageSize)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (pageToken)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (filter: civil_start_time)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (filter: start_time)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.start_time >= "2026-10-01T00:00:00Z" AND daily_vo2_max.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: google-wearables)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (dataSourceFamily: google-sources)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max List (combined)"
    action: "list"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.start_time >= "2026-10-01T00:00:00Z" AND daily_vo2_max.interval.start_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (Default)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (pageSize)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (pageToken)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (filter: civil_start_time)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (filter: start_time)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.start_time >= "2026-10-01T00:00:00Z" AND daily_vo2_max.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: all-sources)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: google-wearables)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-wearables"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (dataSourceFamily: google-sources)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/google-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Daily VO2 Max Reconcile (combined)"
    action: "reconcile"
    dataType: "daily-vo2-max"
    queryParams:
      filter: 'daily_vo2_max.interval.start_time >= "2026-10-01T00:00:00Z" AND daily_vo2_max.interval.start_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true
