# Google Health API Blood Glucose Standard Tests
name: "Google Health API Blood Glucose Tests"
description: "Standard tests for Blood Glucose datatype"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  - name: "Standard: Blood Glucose List (Default)"
    action: "list"
    dataType: "blood-glucose"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (pageSize)"
    action: "list"
    dataType: "blood-glucose"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (pageToken)"
    action: "list"
    dataType: "blood-glucose"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (filter: sample_time >= datetime)"
    action: "list"
    dataType: "blood-glucose"
    queryParams:
      filter: 'blood_glucose.sample_time.physical_time>="2026-10-01T08:00:00Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (filter: sample_time date range)"
    action: "list"
    dataType: "blood-glucose"
    queryParams:
      filter: 'blood_glucose.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND blood_glucose.sample_time.physical_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (dataSourceFamily: all-sources)"
    action: "list"
    dataType: "blood-glucose"
    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose List (dataSourceFamily: google-wearables)"
