    dataType: "blood-glucose"
    queryParams:
      filter: 'blood_glucose.sample_time.physical_time >= "2026-10-01T00:00:00Z" AND blood_glucose.sample_time.physical_time < "2026-10-08T23:59:59Z"'
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Blood Glucose DailyRollUp (Default)"
    action: "dailyrollup"
    dataType: "blood-glucose"
    body: |
      {
        "range": {
          "start": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 1
            }, 
            "time": {
              "hours": 0, 
              "minutes": 0, 
              "seconds": 0
            }
          },
          "end": {
            "date": {
              "year": 2026, 
              "month": 10, 
              "day": 8
            }, 
            "time": {
              "hours": 23, 
              "minutes": 59, 
              "seconds": 59
            }
          }
        }
