# ==============================================================================
# Google Health API Test Suite - Symptoms Write, Update & Delete Negative Tests
# ==============================================================================
# Tests boundary limits and negative inputs for the symptoms data type across
# create, update (patch), and delete (batchDelete) endpoints using
# verifyWithGet: true to confirm persisted response values:
#   - Out-of-range lower bound (utcOffset < -64800s) and upper bound (> 64800s)
#   - Missing value (empty symptoms array), null value, and empty string ("")
#   - BatchDelete with no value ([]), null ([null]), and empty string ([""])
# ==============================================================================

name: "Google Health API Symptoms Write, Update & Delete Negative Tests"
description: "Boundary and negative tests for creating, updating, and deleting symptoms data points using verifyWithGet"
userId: both # Supported values: me, healthUserId, both
stopOnError: false

steps:
  # ============================================================================
  # SECTION 1: Baseline Create & Update (Patch) Boundary and Negative Tests
  # ============================================================================

  # 1. Create a baseline symptoms entry
  - name: "Standard: Symptoms Create (HEADACHE)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
            "HEADACHE"
          ]
        }
      }
    assertStatus: [200, 201]
    validateRange: true

  # 2. Negative Update: Below lower bound limit (utcOffset < -64800s)
  - name: "Negative: Symptoms Update Below Lower Bound (utcOffset = -99999s)"
    action: "patch"
    verifyWithGet: true
    dataType: "symptoms"
    dataPointId: "${uniqueName}"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-99999s"
          },
          "symptoms": [
            "HEADACHE",
            "CRAMPS"
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 3. Negative Update: Above upper bound limit (utcOffset > 64800s)
  - name: "Negative: Symptoms Update Above Upper Bound (utcOffset = 99999s)"
    action: "patch"
    verifyWithGet: true
    dataType: "symptoms"
    dataPointId: "${uniqueName}"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "99999s"
          },
          "symptoms": [
            "HEADACHE",
            "CRAMPS"
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 4. Negative Update: No value provided (empty symptoms array)
  - name: "Negative: Symptoms Update (no value)"
    action: "patch"
    verifyWithGet: true
    dataType: "symptoms"
    dataPointId: "${uniqueName}"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 5. Negative Update: null value provided (symptoms = [null])
  - name: "Negative: Symptoms Update (symptoms = null)"
    action: "patch"
    verifyWithGet: true
    dataType: "symptoms"
    dataPointId: "${uniqueName}"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
            null
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 6. Negative Update: Empty string value provided (symptoms = [""])
  - name: "Negative: Symptoms Update (symptoms = empty string)"
    action: "patch"
    verifyWithGet: true
    dataType: "symptoms"
    dataPointId: "${uniqueName}"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
            ""
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 7. Clean up baseline symptoms entry via batchDelete
  - name: "Standard: Symptoms BatchDelete (Clean Up Baseline)"
    action: "batchDelete"
    dataType: "symptoms"
    body: |
      {
        "names": [
          "${uniqueName}"
        ]
      }
    assertStatus: [200]
    validateRange: false

  # ============================================================================
  # SECTION 2: Create Boundary and Negative Tests
  # ============================================================================

  # 8. Negative Create: Below lower bound limit (utcOffset < -64800s)
  - name: "Negative: Symptoms Create Below Lower Bound (utcOffset = -99999s)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-99999s"
          },
          "symptoms": [
            "HEADACHE"
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 9. Negative Create: Above upper bound limit (utcOffset > 64800s)
  - name: "Negative: Symptoms Create Above Upper Bound (utcOffset = 99999s)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "99999s"
          },
          "symptoms": [
            "HEADACHE"
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 10. Negative Create: No value provided (empty symptoms array)
  - name: "Negative: Symptoms Create (no value)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 11. Negative Create: null value provided (symptoms = [null])
  - name: "Negative: Symptoms Create (symptoms = null)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
            null
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # 12. Negative Create: Empty string value provided (symptoms = [""])
  - name: "Negative: Symptoms Create (symptoms = empty string)"
    action: "create"
    verifyWithGet: true
    dataType: "symptoms"
    body: |
      {
        "symptoms": {
          "sampleTime": {
            "physicalTime": "2026-10-15T12:00:00Z",
            "utcOffset": "-14400s"
          },
          "symptoms": [
            ""
          ]
        }
      }
    assertStatus: [400]
    validateRange: true

  # ============================================================================
  # SECTION 3: Negative Delete (BatchDelete) Tests
  # ============================================================================

  # 13. Negative BatchDelete: No value provided (empty names array)
  - name: "Negative: Symptoms BatchDelete (no value)"
    action: "batchDelete"
    dataType: "symptoms"
    body: |
      {
        "names": [
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 14. Negative BatchDelete: null value provided
  - name: "Negative: Symptoms BatchDelete (null)"
    action: "batchDelete"
    dataType: "symptoms"
    body: |
      {
        "names": [
          null
        ]
      }
    assertStatus: [400]
    validateRange: false

  # 15. Negative BatchDelete: Empty string provided
  - name: "Negative: Symptoms BatchDelete (empty string)"
    action: "batchDelete"
    dataType: "symptoms"
    body: |
      {
        "names": [
          ""
        ]
      }
    assertStatus: [400]
    validateRange: false

