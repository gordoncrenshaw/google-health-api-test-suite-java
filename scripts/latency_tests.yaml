    queryParams:
      dataSourceFamily: "users/me/dataSourceFamilies/all-sources"
    assertStatus: [200]
    validateRange: true
    # maxLatencyMs: 1000

  - name: "Latency: Active Energy Burned List (dataSourceFamily: google-wearables)"
