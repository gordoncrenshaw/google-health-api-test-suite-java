# Google Health API Latency Tests
# - Global latency criteria is configured at the top of the file via `maxLatencyMs: 1000` (in milliseconds).
# - Any individual endpoint step can override the global criteria by specifying `maxLatencyMs: <ms>` on that step.
name: "Google Health API Latency Tests"
description: "Latency tests across all Google Health API datatypes and endpoints (fails if latency > 1000 ms)"
userId: both # Supported values: me, healthUserId, both
stopOnError: false
maxLatencyMs: 1000 # Global max allowed latency in milliseconds for all endpoints

steps:
  # ============================================================================
  # Active Energy Burned Latency Tests
  # ============================================================================
  - name: "Latency: Active Energy Burned List (Default)"
    action: "list"
    dataType: "active-energy-burned"
    assertStatus: [200]
    validateRange: true
    # maxLatencyMs: 1000 # Optional endpoint-specific latency criteria override (ms)

  - name: "Latency: Active Energy Burned List (pageSize)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true
    # maxLatencyMs: 1000

  - name: "Latency: Active Energy Burned List (pageToken)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      pageToken: ""
    assertStatus: [200]
    validateRange: true
    # maxLatencyMs: 1000

  - name: "Latency: Active Energy Burned List (filter: civil_start_time)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      filter: 'active_energy_burned.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true
    # maxLatencyMs: 1000

  - name: "Latency: Active Energy Burned List (filter: start_time)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      filter: 'active_energy_burned.interval.start_time >= "2026-10-01T00:00:00Z" AND active_energy_burned.interval.start_time < "2026-10-08T23:59:59Z"'
