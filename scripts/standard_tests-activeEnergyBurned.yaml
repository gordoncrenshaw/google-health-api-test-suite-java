    validateRange: true

  - name: "Standard: Active Energy Burned List (filter: civil_start_time)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      filter: 'active_energy_burned.interval.civil_start_time >= "2026-10-01"'
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Energy Burned List (filter: start_time)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      filter: 'active_energy_burned.interval.start_time >= "2026-10-01T00:00:00Z" AND active_energy_burned.interval.start_time < "2026-10-08T23:59:59Z"'
    assertStatus: [200]
    validateRange: true

