# Quick smoke test for verifying Google Health API basic connectivity
name: "Google Health API Smoke Test"
description: "Quick sanity checks on all endpoints"
stopOnError: false

steps:
  # Datatype Tests
  - name: "Standard: Active Energy Burned List (Default)"
    action: "list"
    dataType: "active-energy-burned"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Energy Burned List (pageSize)"
    action: "list"
    dataType: "active-energy-burned"
    queryParams:
      pageSize: "5"
    assertStatus: [200]
    validateRange: true

  - name: "Standard: Active Energy Burned List (pageToken)"
